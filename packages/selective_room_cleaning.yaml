# Selective Room Cleaning

script:
  start_selective_room_cleaning:
    alias: Start selective room cleaning
    sequence:
    - action: vacuum.clean_area
      entity_id: vacuum.bobby
      data_template:
        cleaning_area_id: >
          {{ label_entities('selective_room_cleaning') 
            | select('is_state', 'on') 
            | map('state_attr', 'friendly_name')
            | map('area_id') 
            | list
          }}


automation:
  - id: 'tiykEfAD'
    alias: Reset selected rooms when docked
    trigger:
      platform: state
      entity_id: vacuum.robocop
      to: 'docked'
    action:
    - action: input_boolean.turn_off
      target:
        label_id: selective_room_cleaning
        

input_boolean:
  clean_entrance:
    name: Entrance
    icon: mdi:shoe-sneaker

  clean_hallway:
    name: Hallway
    icon: mdi:image-frame

  clean_bedroom:
    name: Bedroom
    icon: mdi:bed-empty

  clean_kitchen:
    name: Kitchen
    icon: mdi:silverware-fork-knife

  clean_office:
    name: Office
    icon: mdi:laptop

  clean_living_room:
    name: Living room
    icon: mdi:sofa

  clean_kids_room:
    name: Kids room
    icon: mdi:teddy-bear

  # {{ label_entities('selective_room_cleaning') | select('is_state', 'on') | map('state_attr', 'friendly_name') | list | join(', ')  }} 