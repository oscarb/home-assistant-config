name: Trigger agent to work labeled issues

on:
  issues:
    types: [labeled]

jobs:
  agent-run:
    if: github.event.label.name == 'agent:gemini' && github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider & Linters
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install aider-chat yamllint

      - name: Run Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BRANCH_NAME="agent/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"

          # Run Aider headlessly.
          aider --model gemini/gemini-3.8-flash \
                --read AGENTS.md \
                --lint-cmd "yamllint -d relaxed automations/" \
                --auto-lint \
                --message "Update or create files inside the 'automations/' directory according to this prompt: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}" \
                --yes \
                configuration.yaml automations/*.yaml


          # Commit changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Resolve issue #${{ github.event.issue.number }}" || exit 0
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture the latest commit message or custom summary generated by Aider
          AI_SUMMARY=$(git log -1 --pretty=%B)

          gh pr create \
            --title "${{ github.event.issue.title }}" \
            --body "${AI_SUMMARY} \
            Closes #${{ github.event.issue.number }}"
            --head "agent/issue-${{ github.event.issue.number }}" \
            --base main


      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "PR created and passed HA schema checks. Ready for review."
