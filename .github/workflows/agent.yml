name: Trigger agent to work labeled issues

on:
  issues:
    types: [labeled]

jobs:
  agent-run:
    if: github.event.label.name == 'agent:gemini'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider & Linters
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install aider-chat yamllint

      - run: aider --models gemini/          

      - name: Run Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BRANCH_NAME="agent/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"

          # Run Aider headlessly.
          aider --model models/gemini-3.1-pro-preview \
                --lint-cmd "yamllint -d relaxed automations/" \
                --auto-lint \
                --no-auto-commits \
                --message "Update or create files inside the 'automations/' directory according to this prompt: ${{ github.event.issue.title }}. Details: ${{ github.event.issue.body }}" \
                --yes \
                automations/

          # Commit changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automations.yaml
          git commit -m "feat(automation): resolve issue #${{ github.event.issue.number }}" || exit 0
          git push origin "$BRANCH_NAME"

      - name: Validate Home Assistant Schema
        run: |
          # Stub empty secrets and dummy configuration for schema check
          touch secrets.yaml
          if [ ! -f configuration.yaml ]; then
            echo "automation: !include automations.yaml" > configuration.yaml
          fi

          # Run the real Home Assistant core check
          docker run --rm -v "$(pwd):/config" ghcr.io/home-assistant/home-assistant:stable \
            python3 -m homeassistant --config /config --script check_config

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "AI: ${{ github.event.issue.title }}" \
            --body "Automated changes for #${{ github.event.issue.number }}.\n\nValidated via Home Assistant \`check_config\`." \
            --head "ai/issue-${{ github.event.issue.number }}" \
            --base main

      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "PR created and passed HA schema checks. Ready for review."
